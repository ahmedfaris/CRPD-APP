# =============================================================================
# Docker Compose for Enterprise IT Service Desk & Device Asset Management
# Runs PostgreSQL 16 + Production Node.js App container
# =============================================================================

version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # Database Service: PostgreSQL 16
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: itsm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-itsm_db}
    ports:
      - "${SQL_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-itsm_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - itsm_network

  # ---------------------------------------------------------------------------
  # Application Service: Web UI & Backend MVC Server
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: itsm_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-itsm_db}
      SQL_HOST: postgres
      SQL_PORT: 5432
      SQL_USER: ${POSTGRES_USER:-postgres}
      SQL_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass_2026}
      SQL_DB_NAME: ${POSTGRES_DB:-itsm_db}
      JWT_SECRET: ${JWT_SECRET:-production-local-jwt-secret-replace-in-env-2026}
      DATABASE_SSL: "false"
    networks:
      - itsm_network

# -----------------------------------------------------------------------------
# Persistent Volumes & Networks
# -----------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local

networks:
  itsm_network:
    driver: bridge
